<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>COSMO RUSH — Endless Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #050510;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #hud.visible {
            opacity: 1;
        }

        .hud-panel {
            background: rgba(10, 15, 40, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(100, 180, 255, 0.3);
            border-radius: 16px;
            padding: 12px 20px;
            text-align: center;
            min-width: 120px;
        }

        .hud-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(150, 200, 255, 0.8);
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
        }

        #coin-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #00d4ff, #0088cc);
            border-radius: 50%;
            box-shadow: 0 0 10px #00d4ff, 0 0 20px rgba(0, 212, 255, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        #start-screen, #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(10, 20, 60, 0.85), rgba(5, 5, 30, 0.9));
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: all;
            transition: opacity 0.5s;
        }

        #start-screen.hidden, #gameover-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .screen-title {
            font-size: clamp(48px, 10vw, 96px);
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #7b2fff, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .screen-subtitle {
            font-size: clamp(14px, 3vw, 20px);
            color: rgba(200, 220, 255, 0.8);
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .screen-score {
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .screen-prompt {
            font-size: clamp(14px, 2.5vw, 18px);
            color: #fff;
            animation: blink 1.2s infinite;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #050510;
            z-index: 100;
            transition: opacity 0.8s;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: rgba(150, 200, 255, 0.8);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(150, 200, 255, 0.5);
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-overlay">
        <div id="hud">
            <div class="hud-panel">
                <div class="hud-label">Score</div>
                <div class="hud-value" id="score-value">0</div>
            </div>
            <div class="hud-panel">
                <div id="coin-display">
                    <div class="coin-icon"></div>
                    <div class="hud-value" id="coin-value">0</div>
                </div>
            </div>
            <div class="hud-panel">
                <div class="hud-label">Speed</div>
                <div class="hud-value" id="speed-value">0</div>
            </div>
        </div>

        <div id="start-screen">
            <div class="screen-title">COSMO RUSH</div>
            <div class="screen-subtitle">Endless Runner на космической станции</div>
            <div class="screen-prompt">Нажми ПРОБЕЛ или тапни для старта</div>
            <div class="controls-hint">← → — смена полосы | ↑/Пробел — прыжок | Свайпы на мобильных</div>
        </div>

        <div id="gameover-screen" class="hidden">
            <div class="screen-title">GAME OVER</div>
            <div class="screen-score" id="final-score">0</div>
            <div class="screen-prompt">Нажми ПРОБЕЛ или тапни для рестарта</div>
        </div>

        <div id="loading-screen">
            <div class="spinner"></div>
            <div class="loading-text">Загрузка станции...</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ====== GAME STATE ======
        const state = {
            status: 'loading',
            score: 0,
            coins: 0,
            speed: 0.3,
            maxSpeed: 0.8,
            speedIncrement: 0.0002,
            distance: 0,
            currentLane: 1,
            targetLane: 1,
            isJumping: false,
            velocityY: 0,
            gravity: -0.018,
            jumpForce: 0.32,
            playerBaseY: 0,
            laneWidth: 3.5,
            playerTilt: 0,
            targetTilt: 0,
            mixer: null,
            runAction: null,
            playerModel: null,
            segments: [],
            buildings: [],
            obstacles: [],
            orbs: [],
            particles: [],
            segmentLength: 40,
            segmentCount: 5,
            spawnZ: -200
        };

        // ====== THREE.JS SETUP ======
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.Fog(0x050510, 60, 180);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, 2, -10);

        // ====== LIGHTING ======
        const hemiLight = new THREE.HemisphereLight(0x334466, 0x111122, 0.6);
        scene.add(hemiLight);

        const ambientLight = new THREE.AmbientLight(0x222244, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xaaccff, 1.5);
        dirLight.position.set(-10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        const bluePoint1 = new THREE.PointLight(0x0088ff, 2, 50);
        bluePoint1.position.set(-8, 5, -20);
        scene.add(bluePoint1);

        const bluePoint2 = new THREE.PointLight(0x00ccff, 2, 50);
        bluePoint2.position.set(8, 5, -30);
        scene.add(bluePoint2);

        // ====== STARFIELD ======
        function createStarfield() {
            const starsGeo = new THREE.BufferGeometry();
            const positions = [];
            for (let i = 0; i < 3000; i++) {
                const x = (Math.random() - 0.5) * 600;
                const y = Math.random() * 200 + 20;
                const z = (Math.random() - 0.5) * 600;
                positions.push(x, y, z);
            }
            starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);
            return stars;
        }
        const starfield = createStarfield();

        // ====== MATERIALS ======
        const roadMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a3a,
            metalness: 0.8,
            roughness: 0.4
        });

        const ledStripMaterial = new THREE.MeshStandardMaterial({
            color: 0x00aaff,
            emissive: 0x0088ff,
            emissiveIntensity: 2.0,
            metalness: 0.5,
            roughness: 0.2
        });

        const barrierMaterial = new THREE.MeshStandardMaterial({
            color: 0x444466,
            metalness: 0.9,
            roughness: 0.3
        });

        const cableMaterial = new THREE.MeshStandardMaterial({
            color: 0x222233,
            metalness: 0.6,
            roughness: 0.5
        });

        const buildingMaterial = new THREE.MeshStandardMaterial({
            color: 0x333355,
            metalness: 0.7,
            roughness: 0.4
        });

        const windowMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ccff,
            emissive: 0x0066aa,
            emissiveIntensity: 1.5,
            metalness: 0.3,
            roughness: 0.2
        });

        const redEmissiveMaterial = new THREE.MeshStandardMaterial({
            color: 0xff2200,
            emissive: 0xff0000,
            emissiveIntensity: 2.0
        });

        const obstacleLaserMaterial = new THREE.MeshStandardMaterial({
            color: 0xff4400,
            emissive: 0xff2200,
            emissiveIntensity: 3.0,
            transparent: true,
            opacity: 0.8
        });

        const biohazardMaterial = new THREE.MeshStandardMaterial({
            color: 0x445500,
            metalness: 0.6,
            roughness: 0.5
        });

        const orbMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ddff,
            emissive: 0x00aadd,
            emissiveIntensity: 2.5,
            metalness: 0.9,
            roughness: 0.1,
            transparent: true,
            opacity: 0.9
        });

        // ====== ROAD SEGMENT CREATION ======
        function createRoadSegment(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;

            const roadGeo = new THREE.BoxGeometry(state.laneWidth * 3 + 2, 0.3, state.segmentLength);
            const road = new THREE.Mesh(roadGeo, roadMaterial);
            road.position.y = -0.15;
            road.receiveShadow = true;
            group.add(road);

            for (let i = -2; i <= 2; i += 2) {
                const gridGeo = new THREE.BoxGeometry(0.05, 0.02, state.segmentLength);
                const gridMat = new THREE.MeshStandardMaterial({ color: 0x555577, metalness: 0.9, roughness: 0.2 });
                const grid = new THREE.Mesh(gridGeo, gridMat);
                grid.position.set(i * 1.5, 0.01, 0);
                group.add(grid);
            }

            for (let i = -1; i <= 1; i += 2) {
                const ledGeo = new THREE.BoxGeometry(0.15, 0.08, state.segmentLength);
                const led = new THREE.Mesh(ledGeo, ledStripMaterial);
                led.position.set(i * state.laneWidth / 2, 0.04, 0);
                group.add(led);

                for (let z = -state.segmentLength / 2; z < state.segmentLength / 2; z += 4) {
                    const glowGeo = new THREE.SphereGeometry(0.1, 8, 8);
                    const glow = new THREE.Mesh(glowGeo, ledStripMaterial);
                    glow.position.set(i * state.laneWidth / 2, 0.1, z);
                    group.add(glow);
                }
            }

            for (let side = -1; side <= 1; side += 2) {
                const barrierGeo = new THREE.BoxGeometry(0.4, 1.2, state.segmentLength);
                const barrier = new THREE.Mesh(barrierGeo, barrierMaterial);
                barrier.position.set(side * (state.laneWidth * 1.5 + 1.2), 0.6, 0);
                barrier.castShadow = true;
                barrier.receiveShadow = true;
                group.add(barrier);

                const cableGeo = new THREE.CylinderGeometry(0.08, 0.08, state.segmentLength, 8);
                const cable = new THREE.Mesh(cableGeo, cableMaterial);
                cable.rotation.x = Math.PI / 2;
                cable.position.set(side * (state.laneWidth * 1.5 + 1.5), 1.4, 0);
                group.add(cable);

                const cable2Geo = new THREE.CylinderGeometry(0.06, 0.06, state.segmentLength, 8);
                const cable2 = new THREE.Mesh(cable2Geo, cableMaterial);
                cable2.rotation.x = Math.PI / 2;
                cable2.position.set(side * (state.laneWidth * 1.5 + 1.7), 0.9, 0);
                group.add(cable2);
            }

            for (let z = -state.segmentLength / 2 + 5; z < state.segmentLength / 2; z += 15) {
                for (let side = -1; side <= 1; side += 2) {
                    const postGeo = new THREE.CylinderGeometry(0.12, 0.15, 3.5, 8);
                    const postMat = new THREE.MeshStandardMaterial({ color: 0x333355, metalness: 0.9, roughness: 0.2 });
                    const post = new THREE.Mesh(postGeo, postMat);
                    post.position.set(side * (state.laneWidth * 1.5 + 0.5), 1.75, z);
                    post.castShadow = true;
                    group.add(post);

                    const emitterGeo = new THREE.SphereGeometry(0.2, 8, 8);
                    const emitterMat = new THREE.MeshStandardMaterial({
                        color: 0x00ffaa,
                        emissive: 0x00ff88,
                        emissiveIntensity: 2.0
                    });
                    const emitter = new THREE.Mesh(emitterGeo, emitterMat);
                    emitter.position.set(side * (state.laneWidth * 1.5 + 0.5), 3.5, z);
                    group.add(emitter);
                }
            }

            scene.add(group);
            return group;
        }

        // ====== BUILDING CREATION ======
        function createBuilding(zPos, side) {
            const group = new THREE.Group();
            const x = side * (state.laneWidth * 2 + 5 + Math.random() * 8);
            group.position.set(x, 0, zPos);

            const height = 4 + Math.random() * 12;
            const width = 2 + Math.random() * 4;
            const depth = 2 + Math.random() * 4;

            const mainGeo = new THREE.BoxGeometry(width, height, depth);
            const main = new THREE.Mesh(mainGeo, buildingMaterial);
            main.position.y = height / 2;
            main.castShadow = true;
            main.receiveShadow = true;
            group.add(main);

            const windowCount = Math.floor(height / 2);
            for (let i = 0; i < windowCount; i++) {
                const winGeo = new THREE.BoxGeometry(0.4, 0.6, 0.05);
                const winMat = Math.random() > 0.3 ? windowMaterial : redEmissiveMaterial;
                const win = new THREE.Mesh(winGeo, winMat);
                const wSide = Math.random() > 0.5 ? 1 : -1;
                win.position.set(wSide * width / 2 + wSide * 0.02, 1.5 + i * 2, (Math.random() - 0.5) * depth * 0.6);
                group.add(win);
            }

            if (Math.random() > 0.5) {
                const panelGeo = new THREE.BoxGeometry(width * 1.5, 0.1, 2);
                const panelMat = new THREE.MeshStandardMaterial({ color: 0x112244, metalness: 0.9, roughness: 0.3 });
                const panel = new THREE.Mesh(panelGeo, panelMat);
                panel.position.set(0, height + 0.5, 0);
                panel.rotation.x = Math.random() * 0.3;
                panel.castShadow = true;
                group.add(panel);

                const supportGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 6);
                const support = new THREE.Mesh(supportGeo, barrierMaterial);
                support.position.set(0, height + 0.05, 0);
                group.add(support);
            }

            if (Math.random() > 0.6) {
                const antennaHeight = 2 + Math.random() * 3;
                const antennaGeo = new THREE.CylinderGeometry(0.05, 0.05, antennaHeight, 6);
                const antenna = new THREE.Mesh(antennaGeo, barrierMaterial);
                antenna.position.set((Math.random() - 0.5) * width * 0.5, height + antennaHeight / 2, (Math.random() - 0.5) * depth * 0.3);
                group.add(antenna);

                const tipGeo = new THREE.SphereGeometry(0.15, 8, 8);
                const tip = new THREE.Mesh(tipGeo, Math.random() > 0.5 ? windowMaterial : redEmissiveMaterial);
                tip.position.copy(antenna.position);
                tip.position.y += antennaHeight / 2;
                group.add(tip);
            }

            if (Math.random() > 0.7) {
                const termGeo = new THREE.BoxGeometry(0.5, 1.2, 0.3);
                const term = new THREE.Mesh(termGeo, buildingMaterial);
                term.position.set(side > 0 ? -width / 2 - 0.3 : width / 2 + 0.3, 0.6, 0);
                group.add(term);

                const screenGeo = new THREE.BoxGeometry(0.35, 0.5, 0.05);
                const screen = new THREE.Mesh(screenGeo, Math.random() > 0.5 ? windowMaterial : redEmissiveMaterial);
                screen.position.set(side > 0 ? -width / 2 - 0.5 : width / 2 + 0.5, 0.8, 0);
                group.add(screen);
            }

            scene.add(group);
            return group;
        }

        // ====== OBSTACLE CREATION ======
        function createObstacle(lane, zPos) {
            const group = new THREE.Group();
            const laneX = (lane - 1) * state.laneWidth;
            const type = Math.random();

            if (type < 0.4) {
                const crateGeo = new THREE.BoxGeometry(2.2, 1.0, 1.5);
                const crate = new THREE.Mesh(crateGeo, biohazardMaterial);
                crate.position.y = 0.5;
                crate.castShadow = true;
                crate.receiveShadow = true;
                group.add(crate);

                const stripeGeo = new THREE.BoxGeometry(2.25, 0.1, 1.55);
                const stripeMat = new THREE.MeshStandardMaterial({
                    color: 0xffff00,
                    emissive: 0xaaaa00,
                    emissiveIntensity: 1.0
                });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.position.y = 1.01;
                group.add(stripe);

                group.userData.type = 'low';
                group.userData.height = 1.0;
            } else if (type < 0.75) {
                const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.0, 8);
                const postMat = new THREE.MeshStandardMaterial({ color: 0x444466, metalness: 0.9, roughness: 0.2 });

                const post1 = new THREE.Mesh(postGeo, postMat);
                post1.position.set(-1.2, 1.5, 0);
                post1.castShadow = true;
                group.add(post1);

                const post2 = new THREE.Mesh(postGeo, postMat);
                post2.position.set(1.2, 1.5, 0);
                post2.castShadow = true;
                group.add(post2);

                const beamGeo = new THREE.BoxGeometry(2.4, 0.15, 0.15);
                const beam = new THREE.Mesh(beamGeo, obstacleLaserMaterial);
                beam.position.y = 1.5;
                group.add(beam);

                const beam2 = new THREE.Mesh(beamGeo, obstacleLaserMaterial);
                beam2.position.y = 2.2;
                group.add(beam2);

                group.userData.type = 'high';
                group.userData.height = 3.0;
            } else {
                const crateGeo = new THREE.BoxGeometry(2.0, 2.8, 1.8);
                const crate = new THREE.Mesh(crateGeo, biohazardMaterial);
                crate.position.y = 1.4;
                crate.castShadow = true;
                crate.receiveShadow = true;
                group.add(crate);

                const lightGeo = new THREE.SphereGeometry(0.2, 8, 8);
                const light = new THREE.Mesh(lightGeo, redEmissiveMaterial);
                light.position.y = 2.9;
                group.add(light);

                group.userData.type = 'tall';
                group.userData.height = 2.8;
            }

            group.position.set(laneX, 0, zPos);
            group.userData.lane = lane;
            group.userData.active = true;
            scene.add(group);
            return group;
        }

        // ====== ORB CREATION ======
        function createOrb(lane, zPos) {
            const group = new THREE.Group();
            const laneX = (lane - 1) * state.laneWidth;

            const orbGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const orb = new THREE.Mesh(orbGeo, orbMaterial);
            orb.castShadow = true;
            group.add(orb);

            const innerGeo = new THREE.SphereGeometry(0.25, 12, 12);
            const innerMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xaaffff,
                emissiveIntensity: 3.0,
                transparent: true,
                opacity: 0.6
            });
            const inner = new THREE.Mesh(innerGeo, innerMat);
            group.add(inner);

            const ringGeo = new THREE.TorusGeometry(0.5, 0.04, 8, 24);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0x00ddff,
                emissive: 0x0088ff,
                emissiveIntensity: 2.0
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            group.add(ring);

            group.position.set(laneX, 1.5, zPos);
            group.userData.collected = false;
            group.userData.baseY = 1.5;
            scene.add(group);
            return group;
        }

        // ====== PARTICLES ======
        function createExplosion(position) {
            const count = 35;
            for (let i = 0; i < count; i++) {
                const size = 0.1 + Math.random() * 0.15;
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({
                    color: Math.random() > 0.5 ? 0x00ccff : 0x0066ff,
                    emissive: 0x0088ff,
                    emissiveIntensity: 3.0,
                    transparent: true,
                    opacity: 1.0
                });
                const particle = new THREE.Mesh(geo, mat);
                particle.position.copy(position);
                particle.position.y += 1;

                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    Math.random() * 0.3 + 0.1,
                    (Math.random() - 0.5) * 0.4
                );
                particle.userData.life = 1.0;
                particle.userData.rotSpeed = new THREE.Vector3(
                    Math.random() * 0.2,
                    Math.random() * 0.2,
                    Math.random() * 0.2
                );

                scene.add(particle);
                state.particles.push(particle);
            }
        }

        // ====== PLAYER ======
        let player = null;
        let cameraTarget = new THREE.Vector3(0, 3, -5);

        function createFallbackPlayer() {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.0, 8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x3366ff,
                metalness: 0.7,
                roughness: 0.3,
                emissive: 0x112244,
                emissiveIntensity: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.2;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({
                color: 0xaaccff,
                metalness: 0.8,
                roughness: 0.2
            });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            head.castShadow = true;
            group.add(head);

            const visorGeo = new THREE.SphereGeometry(0.25, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const visorMat = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x00aaff,
                emissiveIntensity: 1.5,
                metalness: 0.9,
                roughness: 0.1,
                transparent: true,
                opacity: 0.8
            });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.y = 2.0;
            visor.position.z = -0.1;
            visor.rotation.x = Math.PI / 2;
            group.add(visor);

            for (let side = -1; side <= 1; side += 2) {
                const legGeo = new THREE.CapsuleGeometry(0.15, 0.6, 4, 8);
                const leg = new THREE.Mesh(legGeo, bodyMat);
                leg.position.set(side * 0.25, 0.4, 0);
                leg.castShadow = true;
                group.add(leg);
            }

            scene.add(group);
            player = group;
            state.playerBaseY = 0;
            player.position.y = state.playerBaseY;
        }

        function loadPlayerModel() {
            const loader = new GLTFLoader();
            loader.load(
                'player_game.glb',
                (gltf) => {
                    const model = gltf.scene;

                    const box = new THREE.Box3().setFromObject(model);
                    const modelHeight = box.max.y - box.min.y;
                    const scale = 2.0 / modelHeight;
                    model.scale.set(scale, scale, scale);

                    const box2 = new THREE.Box3().setFromObject(model);
                    model.position.y = -box2.min.y;

                    state.playerBaseY = 0;

                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    model.rotation.y = Math.PI;

                    player = new THREE.Group();
                    player.add(model);
                    scene.add(player);
                    player.position.y = state.playerBaseY;

                    if (gltf.animations && gltf.animations.length > 0) {
                        state.mixer = new THREE.AnimationMixer(model);
                        let runClip = null;
                        for (const clip of gltf.animations) {
                            const name = clip.name.toLowerCase();
                            if (name.includes('run') || name.includes('walk') || name.includes('move')) {
                                runClip = clip;
                                break;
                            }
                        }
                        if (!runClip) runClip = gltf.animations[0];
                        if (runClip) {
                            state.runAction = state.mixer.clipAction(runClip);
                            state.runAction.play();
                        }
                    }
                },
                undefined,
                (error) => {
                    console.warn('Player model not found, using fallback capsule:', error);
                    createFallbackPlayer();
                }
            );
        }

        // ====== INITIALIZATION ======
        function initGame() {
            for (let i = 0; i < state.segmentCount; i++) {
                const z = -i * state.segmentLength;
                const seg = createRoadSegment(z);
                state.segments.push(seg);
            }

            for (let i = 0; i < state.segmentCount; i++) {
                const z = -i * state.segmentLength;
                state.buildings.push(createBuilding(z - 5, -1));
                state.buildings.push(createBuilding(z + 5, 1));
                state.buildings.push(createBuilding(z - 15, -1));
                state.buildings.push(createBuilding(z + 15, 1));
            }

            spawnObjectsAhead();

            loadPlayerModel();
        }

        function spawnObjectsAhead() {
            const startZ = state.spawnZ;
            for (let z = startZ; z > startZ - 120; z -= 12) {
                if (Math.random() < 0.6) {
                    const lane = Math.floor(Math.random() * 3);
                    state.obstacles.push(createObstacle(lane, z));

                    if (Math.random() < 0.3) {
                        let lane2 = (lane + 1 + Math.floor(Math.random() * 2)) % 3;
                        state.obstacles.push(createObstacle(lane2, z));
                    }
                }

                if (Math.random() < 0.5) {
                    const lane = Math.floor(Math.random() * 3);
                    state.orbs.push(createOrb(lane, z - 6));
                }
            }
            state.spawnZ -= 120;
        }

        // ====== GAME LOGIC ======
        function updatePlayer(delta) {
            if (!player || state.status !== 'playing') return;

            const targetX = (state.targetLane - 1) * state.laneWidth;
            player.position.x += (targetX - player.position.x) * 0.12;

            if (Math.abs(targetX - player.position.x) > 0.1) {
                state.targetTilt = (targetX > player.position.x ? -1 : 1) * 0.15;
            } else {
                state.targetTilt = 0;
            }
            player.rotation.z += (state.targetTilt - player.rotation.z) * 0.1;

            if (state.isJumping) {
                state.velocityY += state.gravity;
                player.position.y += state.velocityY;

                if (player.position.y <= state.playerBaseY) {
                    player.position.y = state.playerBaseY;
                    state.velocityY = 0;
                    state.isJumping = false;
                }
            }

            if (state.mixer) {
                state.mixer.update(delta);
            }
        }

        function updateWorld() {
            if (state.status !== 'playing') return;

            state.distance += state.speed;
            state.score = Math.floor(state.distance * 10) + state.coins * 50;

            if (state.speed < state.maxSpeed) {
                state.speed += state.speedIncrement;
            }

            for (const seg of state.segments) {
                seg.position.z += state.speed;
                if (seg.position.z > state.segmentLength) {
                    seg.position.z -= state.segmentLength * state.segmentCount;
                }
            }

            for (const bld of state.buildings) {
                bld.position.z += state.speed;
                if (bld.position.z > 30) {
                    bld.position.z -= state.segmentLength * state.segmentCount + 40;
                    bld.position.x = (Math.random() > 0.5 ? 1 : -1) * (state.laneWidth * 2 + 5 + Math.random() * 8);
                }
            }

            for (let i = state.obstacles.length - 1; i >= 0; i--) {
                const obs = state.obstacles[i];
                obs.position.z += state.speed;
                if (obs.position.z > 20) {
                    scene.remove(obs);
                    state.obstacles.splice(i, 1);
                }
            }

            for (let i = state.orbs.length - 1; i >= 0; i--) {
                const orb = state.orbs[i];
                orb.position.z += state.speed;
                orb.rotation.y += 0.05;
                orb.children[0].rotation.y += 0.03;
                orb.position.y = orb.userData.baseY + Math.sin(Date.now() * 0.003 + orb.position.z) * 0.3;

                if (orb.position.z > 20) {
                    scene.remove(orb);
                    state.orbs.splice(i, 1);
                }
            }

            if (state.obstacles.length < 8 || state.orbs.length < 6) {
                spawnObjectsAhead();
            }

            if (player) {
                const playerBox = new THREE.Box3().setFromCenterAndSize(
                    new THREE.Vector3(player.position.x, player.position.y + 1, player.position.z),
                    new THREE.Vector3(1.2, 2.0, 1.0)
                );

                for (const obs of state.obstacles) {
                    if (!obs.userData.active) continue;
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (playerBox.intersectsBox(obsBox)) {
                        if (obs.userData.type === 'low' && player.position.y > obs.userData.height + 0.2) {
                            continue;
                        }
                        gameOver(obs.position);
                        return;
                    }
                }

                for (let i = state.orbs.length - 1; i >= 0; i--) {
                    const orb = state.orbs[i];
                    if (orb.userData.collected) continue;
                    const orbPos = orb.position;
                    const dist = Math.sqrt(
                        Math.pow(player.position.x - orbPos.x, 2) +
                        Math.pow((player.position.y + 1) - orbPos.y, 2) +
                        Math.pow(player.position.z - orbPos.z, 2)
                    );
                    if (dist < 1.5) {
                        orb.userData.collected = true;
                        state.coins++;
                        scene.remove(orb);
                        state.orbs.splice(i, 1);
                    }
                }
            }
        }

        function updateParticles(delta) {
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.userData.velocity.y += state.gravity * 0.5;
                p.position.x += p.userData.velocity.x;
                p.position.y += p.userData.velocity.y;
                p.position.z += p.userData.velocity.z;
                p.rotation.x += p.userData.rotSpeed.x;
                p.rotation.y += p.userData.rotSpeed.y;
                p.rotation.z += p.userData.rotSpeed.z;
                p.userData.life -= 0.02;
                p.material.opacity = p.userData.life;
                p.scale.multiplyScalar(0.97);

                if (p.userData.life <= 0 || p.position.y < -5) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    state.particles.splice(i, 1);
                }
            }
        }

        function updateCamera() {
            if (!player) return;

            const targetCamX = player.position.x * 0.5;
            const targetCamY = 6 + player.position.y * 0.3;
            const targetCamZ = player.position.z + 12;

            camera.position.x += (targetCamX - camera.position.x) * 0.05;
            camera.position.y += (targetCamY - camera.position.y) * 0.05;
            camera.position.z += (targetCamZ - camera.position.z) * 0.05;

            cameraTarget.set(player.position.x, player.position.y + 2, player.position.z - 10);
            camera.lookAt(cameraTarget);

            dirLight.position.z = player.position.z - 5;
            dirLight.target.position.z = player.position.z - 15;
        }

        function updateUI() {
            document.getElementById('score-value').textContent = state.score;
            document.getElementById('coin-value').textContent = state.coins;
            document.getElementById('speed-value').textContent = Math.floor(state.speed * 300);
        }

        // ====== GAME STATE MANAGEMENT ======
        function startGame() {
            state.status = 'playing';
            state.score = 0;
            state.coins = 0;
            state.speed = 0.3;
            state.distance = 0;
            state.currentLane = 1;
            state.targetLane = 1;
            state.isJumping = false;
            state.velocityY = 0;

            if (player) {
                player.position.set(0, state.playerBaseY, 0);
                player.rotation.z = 0;
            }

            for (const obs of state.obstacles) scene.remove(obs);
            state.obstacles = [];
            for (const orb of state.orbs) scene.remove(orb);
            state.orbs = [];
            for (const p of state.particles) {
                scene.remove(p);
                p.geometry.dispose();
                p.material.dispose();
            }
            state.particles = [];

            state.spawnZ = -40;
            spawnObjectsAhead();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('visible');
        }

        function gameOver(hitPos) {
            state.status = 'gameover';
            createExplosion(hitPos);

            document.getElementById('final-score').textContent = `Счёт: ${state.score}`;
            document.getElementById('gameover-screen').classList.remove('hidden');
            document.getElementById('hud').classList.remove('visible');
        }

        // ====== INPUT HANDLING ======
        function handleLeft() {
            if (state.status === 'playing') {
                state.targetLane = Math.max(0, state.targetLane - 1);
            }
        }

        function handleRight() {
            if (state.status === 'playing') {
                state.targetLane = Math.min(2, state.targetLane + 1);
            }
        }

        function handleJump() {
            if (state.status === 'playing' && !state.isJumping) {
                state.isJumping = true;
                state.velocityY = state.jumpForce;
            }
        }

        function handleAction() {
            if (state.status === 'start' || state.status === 'gameover') {
                startGame();
            } else if (state.status === 'playing') {
                handleJump();
            }
        }

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    handleLeft();
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    handleRight();
                    break;
                case 'ArrowUp':
                case 'KeyW':
                case 'Space':
                    e.preventDefault();
                    handleAction();
                    break;
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const dt = Date.now() - touchStartTime;

            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (state.status !== 'playing') {
                handleAction();
                return;
            }

            if (dt < 300 && absDx < 30 && absDy < 30) {
                handleJump();
            } else if (absDx > absDy && absDx > 40) {
                if (dx < 0) handleLeft();
                else handleRight();
            } else if (absDy > absDx && dy < -40) {
                handleJump();
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ====== GAME LOOP ======
        let lastTime = 0;

        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);

            const delta = Math.min((currentTime - lastTime) / 1000, 0.05);
            lastTime = currentTime;

            updatePlayer(delta);
            updateWorld();
            updateParticles(delta);
            updateCamera();
            updateUI();

            starfield.rotation.y += 0.0001;

            renderer.render(scene, camera);
        }

        // ====== START ======
        initGame();

        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
            state.status = 'start';
        }, 1500);

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
